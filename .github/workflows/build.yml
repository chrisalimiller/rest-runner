name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a GitHub Release with this tag (e.g. v0.2.0). Leave empty to only build."
        required: false
        default: ""

# Least privilege by default: every job gets a read-only token unless it
# elevates its own permissions below.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Fail early if the release tag and the app's version disagree, before spending time on installers.
      - name: Check the release tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        run: node scripts/updater-manifest.mjs check-version "${{ inputs.release_tag || github.ref_name }}"

  # The Rust tests run on every push and pull request, without building installers. The Tauri crate embeds the
  # frontend bundle, so the frontend is built first.
  rust-tests:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  # Installers are built only for a release (a v* tag, or a manual run with release_tag set) or when a manual run
  # asks for a build. Pull requests and pushes to main skip this; to run the latest code, clone the repo and build it.
  build:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            name: macos-universal
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundle-dir: src-tauri/target/universal-apple-darwin/release/bundle
          - platform: windows-latest
            name: windows-x64
            args: ""
            rust-targets: ""
            bundle-dir: src-tauri/target/release/bundle
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      # The signing key makes Tauri sign the update files that "Check for updates" installs.
      - run: npm run tauri build -- ${{ matrix.args }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      # After the build, which creates the frontend bundle the Tauri crate embeds.
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      # GitHub turns spaces in asset names into dots, which would break the links in latest.json. Use dashes instead.
      - name: Rename release files without spaces
        shell: bash
        run: |
          cd "${{ matrix.bundle-dir }}"
          for f in dmg/*.dmg msi/*.msi nsis/*.exe nsis/*.exe.sig macos/*.app.tar.gz macos/*.app.tar.gz.sig; do
            [ -e "$f" ] || continue
            new="$(dirname "$f")/$(basename "$f" | tr ' ' '-')"
            [ "$f" = "$new" ] || mv "$f" "$new"
          done
          ls -R .
      - uses: actions/upload-artifact@v5
        with:
          name: rest-runner-${{ matrix.name }}
          path: |
            ${{ matrix.bundle-dir }}/dmg/*.dmg
            ${{ matrix.bundle-dir }}/msi/*.msi
            ${{ matrix.bundle-dir }}/nsis/*.exe
            ${{ matrix.bundle-dir }}/nsis/*.exe.sig
            ${{ matrix.bundle-dir }}/macos/*.app.tar.gz
            ${{ matrix.bundle-dir }}/macos/*.app.tar.gz.sig
          if-no-files-found: error

  # On a v* tag push, or a manual run with release_tag set, publish the
  # installers from the build job as a GitHub Release. A manual run creates the
  # tag on the commit it built.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      # Creates the tag and the GitHub Release, uploads its assets, and calls the
      # generate-notes API. All of these need write access to repository contents.
      contents: write
    env:
      TAG: ${{ inputs.release_tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: installers
          merge-multiple: true
      - run: ls -lR installers
      # The same notes go on the release page and into latest.json, where the app shows them.
      - name: Write release notes
        run: |
          gh api "repos/${{ github.repository }}/releases/generate-notes" \
            -f tag_name="$TAG" -f target_commitish="${{ github.sha }}" --jq .body > release-notes.md
      - name: Write latest.json
        run: |
          node scripts/updater-manifest.mjs build --dir installers --tag "$TAG" \
            --repo "${{ github.repository }}" --notes release-notes.md --out installers/latest.json
          cat installers/latest.json
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: REST Runner ${{ env.TAG }}
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: |
            installers/**/*.dmg
            installers/**/*.msi
            installers/**/*-setup.exe
            installers/**/*.app.tar.gz
            installers/latest.json
