[package]
name = "rest-runner"
version = "0.1.0"
description = "Run batches of REST calls from a Postman-style editor and CSV files"
edition = "2021"

[lib]
# The _lib suffix avoids a name clash with the binary on Windows.
name = "rest_runner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Same TLS stack as before (rustls, plus the OS trust store) so certificates behave alike on macOS and Windows.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "rustls-tls-native-roots", "http2", "gzip", "brotli", "deflate"] }
tokio = { version = "1", features = ["rt", "sync", "time"] }
# Client certificates (see src/certs.rs). Pure Rust, so macOS and Windows run the same code.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
p12-keystore = "0.2"
pkcs8 = { version = "0.10", features = ["encryption", "pem", "std"] }
pem-rfc7468 = { version = "0.7", features = ["alloc"] }
x509-parser = "0.18"
sha2 = "0.10"
# Passphrases go to the OS keychain; the platform backends are selected below.
keyring = "3"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring", "pem"] }
tempfile = "3"

[target.'cfg(windows)'.dependencies]
# Colors the native title bar (see title_bar in src/lib.rs).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }
