[package]
name = "rest-runner"
version = "0.1.0"
description = "Run batches of REST calls from a Postman-style editor and CSV files"
edition = "2021"

[lib]
# The _lib suffix avoids a name clash with the binary on Windows.
name = "rest_runner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
