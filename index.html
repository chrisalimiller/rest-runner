<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>REST Runner</title>
    <script>
      // Sets the theme before the page paints, to avoid a flash. Keep in step with src/lib/theme.ts
      // (key "rest-runner.theme", stored as JSON: "system" | "dark" | "light"); theme.test.ts checks this.
      try {
        var t = JSON.parse(localStorage.getItem("rest-runner.theme"));
        var d = t === "dark" || (t !== "light" && (!window.matchMedia || matchMedia("(prefers-color-scheme: dark)").matches));
        document.documentElement.dataset.theme = d ? "dark" : "light";
      } catch (e) {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
